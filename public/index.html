<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BusinessFind — Find great places. Bring people with you.</title>
<meta name="description" content="Search every kind of business near you, save the ones worth returning to, and see where your friends are headed.">
<meta name="color-scheme" content="light dark">
<script>
/* Anti-flash theme boot. Must run before first paint. Never throws. */
(function () {
  try {
    var THEMES = { aurora: 1, midnight: 1, meadow: 1, sunset: 1, mono: 1 };
    var saved = null;
    try { saved = window.localStorage.getItem('bf-theme'); } catch (e) { saved = null; }
    var resolved;
    if (saved && THEMES[saved]) {
      resolved = saved;
    } else {
      var dark = false;
      try {
        dark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      } catch (e) { dark = false; }
      resolved = dark ? 'midnight' : 'aurora';
    }
    document.documentElement.dataset.theme = resolved;
    if (!saved || (saved !== 'system' && !THEMES[saved])) {
      document.documentElement.setAttribute('data-theme-pref', 'system');
    } else {
      document.documentElement.setAttribute('data-theme-pref', saved);
    }
  } catch (e) {
    try { document.documentElement.dataset.theme = 'aurora'; } catch (e2) {}
  }
})();
</script>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%93%8D%3C/text%3E%3C/svg%3E">
</head>
<body>
<div id="app" class="app-shell"></div>
<noscript>BusinessFind needs JavaScript to search for places near you. Please enable JavaScript and reload this page.</noscript>
<script type="module" src="/app.js"></script>
</body>
</html>
